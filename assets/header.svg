<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0C10"/>
      <stop offset="1" stop-color="#0D1119"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171D2B"/>
      <stop offset="1" stop-color="#0B0E15"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1000" height="440" rx="12" fill="url(#bg)"/>

  <g fill="#E6E1D0">
    <circle cx="140" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="210" cy="150" r="1" opacity="0.35"/>
    <circle cx="392" cy="122" r="1" opacity="0.3"/>
    <circle cx="618" cy="82" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="702" cy="140" r="1" opacity="0.35"/>
    <circle cx="782" cy="95" r="1.3" opacity="0.55"/>
    <circle cx="860" cy="60" r="1" opacity="0.4"/>
    <circle cx="930" cy="130" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="180" r="1" opacity="0.3"/>
    <circle cx="956" cy="205" r="1" opacity="0.3"/>
    <circle cx="120" cy="240" r="1" opacity="0.3"/>
    <circle cx="880" cy="250" r="1" opacity="0.3"/>
  </g>

  <!-- единственный источник варп-дымки: за порталом, свет бьёт изнутри -->
  <ellipse cx="500" cy="120" rx="190" ry="70" fill="#C77DFF" opacity="0.10" filter="url(#haze)">
    <animate attributeName="opacity" values="0.07;0.13;0.07" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- монолит: тёмная плита в проёме, из неё бьёт свет; рунный ромб над ним -->
  <rect x="474" y="150" width="52" height="182" rx="3"
        fill="#10141C" stroke="#2ED1C0" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="496" y="124" width="8" height="8" transform="rotate(45 500 128)"
        fill="none" stroke="#2ED1C0" stroke-width="1.2" opacity="0.45"/>
  <circle cx="500" cy="152" r="8" fill="#33FF66" opacity="0.18" filter="url(#soft)">
    <animate attributeName="opacity" values="0.1;0.32;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <line x1="500" y1="158" x2="500" y2="325" stroke="#33FF66" stroke-width="9" opacity="0.09"/>
  <line x1="500" y1="158" x2="500" y2="325" stroke="#33FF66" stroke-width="2.2">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <!-- отражение на полу -->
  <ellipse cx="500" cy="352" rx="470" ry="22" fill="#12151C" opacity="0.5" filter="url(#soft)"/>
  <rect x="60" y="351" width="880" height="1" fill="#1A1E26"/>

  <!-- портал: готическая арка, вырезанная в каменной раме (evenodd-дырка) -->
  <path fill-rule="evenodd" fill="url(#frame)" stroke="#1C2230" stroke-width="1"
        d="M 290 340 L 290 170 C 290 90 380 55 500 55 C 620 55 710 90 710 170 L 710 340 Z
           M 350 340 L 350 188 C 350 122 418 106 500 106 C 582 106 650 122 650 188 L 650 340 Z"/>

  <!-- контур проёма: бирюза слева, фиолет справа -->
  <path d="M 350 340 L 350 188 C 350 122 418 106 500 106" fill="none" stroke="#2ED1C0" stroke-width="1" opacity="0.35"/>
  <path d="M 650 340 L 650 188 C 650 122 582 106 500 106" fill="none" stroke="#C77DFF" stroke-width="1" opacity="0.25"/>

  <!-- рунные метки на раме портала -->
  <g fill="none" stroke="#2ED1C0" stroke-opacity="0.5">
    <rect x="296" y="196" width="7" height="7" transform="rotate(45 299.5 199.5)"/>
    <rect x="296" y="262" width="7" height="7" transform="rotate(45 299.5 265.5)"/>
  </g>
  <g fill="none" stroke="#C77DFF" stroke-opacity="0.4">
    <rect x="697" y="196" width="7" height="7" transform="rotate(45 700.5 199.5)"/>
    <rect x="697" y="262" width="7" height="7" transform="rotate(45 700.5 265.5)"/>
  </g>

  <!-- цоколь -->
  <polygon points="270,340 730,340 748,360 252,360" fill="#10141C" stroke="#1C2230" stroke-width="1"/>
  <rect x="410" y="360" width="180" height="13" fill="#12151C"/>
  <ellipse cx="500" cy="373" rx="130" ry="7" fill="#33FF66" opacity="0.08" filter="url(#soft)"/>
  <line x1="415" y1="373" x2="585" y2="373" stroke="#C8A24A" stroke-width="1" opacity="0.5"/>

  <text x="500" y="410" fill="#33FF66" opacity="0.14" filter="url(#soft)" font-size="36"
        font-weight="bold" letter-spacing="15" text-anchor="middle">ELI</text>
  <text x="500" y="410" fill="#E6E1D0" font-size="36" font-weight="bold"
        letter-spacing="15" text-anchor="middle">ELI</text>

  <text x="500" y="430" fill="#8A8577" font-size="11" letter-spacing="3"
        text-anchor="middle">SERVICE ENGINEER</text>
</svg>
